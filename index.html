<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OLEA — Óleos que contam histórias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     RESET & VARIÁVEIS
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --verde-escuro: #1f3d2b;
    --verde-medio:  #2f5a3d;
    --verde-claro:  #e8f0e6;
    --mostarda:     #e3a008;
    --mostarda-esc: #b87d00;
    --creme:        #f7f3ea;
    --creme-2:      #efe8d8;
    --carvao:       #1a1a18;
    --cinza:        #6b6b63;
    --branco:       #ffffff;
    --sombra-sm: 0 2px 8px rgba(31,61,43,.08);
    --sombra-md: 0 12px 32px rgba(31,61,43,.12);
    --sombra-lg: 0 24px 60px rgba(31,61,43,.18);
    --radius: 18px;
    --radius-sm: 10px;
    --trans: .35s cubic-bezier(.22,.61,.36,1);
    --max: 1280px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--creme);
    color: var(--carvao);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  .container { max-width: var(--max); margin: 0 auto; padding: 0 28px; }

  /* ============================================================
     HEADER / NAV
  ============================================================ */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(247,243,234,.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(31,61,43,.08);
    transition: var(--trans);
  }
  .header.scrolled { box-shadow: var(--sombra-sm); }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    height: 78px;
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Fraunces', serif; font-weight: 900;
    font-size: 1.6rem; color: var(--verde-escuro);
    letter-spacing: -.04em;
  }
  .logo .mark {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--mostarda), var(--verde-escuro));
    display: grid; place-items: center;
    color: var(--creme); font-size: 1.1rem;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.2);
  }
  .logo span.dot { color: var(--mostarda); }

  .nav-links { display: flex; align-items: center; gap: 34px; }
  .nav-links a {
    font-size: .92rem; font-weight: 500; color: var(--verde-escuro);
    position: relative; padding: 4px 0;
    transition: var(--trans);
  }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -2px;
    width: 0; height: 2px; background: var(--mostarda);
    transition: width var(--trans);
  }
  .nav-links a:hover { color: var(--mostarda-esc); }
  .nav-links a:hover::after { width: 100%; }

  .btn-loja {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--verde-escuro); color: var(--creme);
    padding: 12px 26px; border-radius: 100px;
    font-weight: 600; font-size: .92rem;
    transition: var(--trans);
    box-shadow: 0 6px 18px rgba(31,61,43,.25);
    position: relative; overflow: hidden;
  }
  .btn-loja::before {
    content: ''; position: absolute; inset: 0;
    background: var(--mostarda); transform: translateY(100%);
    transition: transform var(--trans); z-index: 0;
  }
  .btn-loja:hover::before { transform: translateY(0); }
  .btn-loja:hover { color: var(--carvao); box-shadow: 0 10px 28px rgba(227,160,8,.4); }
  .btn-loja span, .btn-loja svg { position: relative; z-index: 1; }
  .btn-loja svg { width: 16px; height: 16px; transition: transform var(--trans); }
  .btn-loja:hover svg { transform: translateX(4px); }

  .menu-toggle { display: none; flex-direction: column; gap: 5px; padding: 8px; }
  .menu-toggle span { width: 24px; height: 2px; background: var(--verde-escuro); border-radius: 2px; transition: var(--trans); }

  /* ============================================================
     SECÇÃO INFO (HERO) — Página principal
  ============================================================ */
  .hero {
    position: relative;
    padding: 90px 0 100px;
    overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: -180px; right: -180px;
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(227,160,8,.18), transparent 70%);
    z-index: 0;
  }
  .hero::after {
    content: ''; position: absolute; bottom: -120px; left: -120px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(47,90,61,.12), transparent 70%);
    z-index: 0;
  }
  .hero-grid {
    display: grid; grid-template-columns: 1.05fr .95fr;
    gap: 70px; align-items: center; position: relative; z-index: 1;
  }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--verde-claro); color: var(--verde-medio);
    font-size: .78rem; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; padding: 8px 16px; border-radius: 100px;
    margin-bottom: 26px;
  }
  .eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--mostarda); }

  .hero h1 {
    font-size: clamp(2.6rem, 5.2vw, 4.3rem);
    color: var(--verde-escuro); margin-bottom: 26px;
  }
  .hero h1 em { font-style: italic; color: var(--mostarda-esc); font-weight: 600; }

  .hero p.lead {
    font-size: 1.12rem; color: var(--cinza);
    max-width: 520px; margin-bottom: 38px;
  }

  .hero-cta { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--mostarda); color: var(--carvao);
    padding: 16px 34px; border-radius: 100px;
    font-weight: 700; font-size: 1rem;
    transition: var(--trans);
    box-shadow: 0 10px 26px rgba(227,160,8,.35);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(227,160,8,.5); background: var(--mostarda-esc); color: var(--branco); }
  .btn-primary svg { width: 18px; height: 18px; }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 600; color: var(--verde-escuro); font-size: .95rem;
    border-bottom: 2px solid transparent; padding-bottom: 4px;
    transition: var(--trans);
  }
  .btn-ghost:hover { border-color: var(--mostarda); gap: 12px; }

  /* Visual do hero — frasco + cartões flutuantes */
  .hero-visual { position: relative; display: flex; justify-content: center; }
  .hero-visual .glow {
    position: absolute; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(227,160,8,.35), transparent 65%);
    top: 50%; left: 50%; transform: translate(-50%,-50%);
    filter: blur(20px);
  }
  .hero-visual .bottle {
    position: relative; width: 230px; height: 400px;
    background: linear-gradient(160deg, #2f5a3d 0%, #1f3d2b 55%, #16301f 100%);
    border-radius: 40px 40px 34px 34px;
    box-shadow: var(--sombra-lg), inset -12px 0 30px rgba(0,0,0,.35), inset 12px 0 20px rgba(255,255,255,.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 26px; text-align: center; color: var(--creme);
    z-index: 2;
  }
  .hero-visual .bottle::before {
    content: ''; position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    width: 70px; height: 34px; background: linear-gradient(180deg, #d9b45a, #a8862f);
    border-radius: 12px 12px 6px 6px; box-shadow: inset 0 -4px 8px rgba(0,0,0,.25);
  }
  .hero-visual .bottle .label-olea {
    font-family: 'Fraunces', serif; font-size: 2.1rem; font-weight: 900;
    letter-spacing: .18em; color: var(--mostarda);
    border-top: 2px solid rgba(227,160,8,.5);
    border-bottom: 2px solid rgba(227,160,8,.5);
    padding: 12px 0; margin-bottom: 18px; width: 100%;
  }
  .hero-visual .bottle small { font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; opacity: .75; }
  .hero-visual .bottle .tipo { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.15rem; margin-top: 8px; color: #f2e3bf; }

  .float-card {
    position: absolute; background: var(--branco); border-radius: var(--radius-sm);
    padding: 14px 18px; box-shadow: var(--sombra-md);
    display: flex; align-items: center; gap: 12px; z-index: 3;
    animation: float 5s ease-in-out infinite;
  }
  .float-card .ic {
    width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
    background: var(--verde-claro); color: var(--verde-medio); font-size: 1.1rem;
  }
  .float-card b { display: block; font-size: .86rem; color: var(--verde-escuro); }
  .float-card small { font-size: .72rem; color: var(--cinza); }
  .float-card.c1 { top: 8%; left: -6%; animation-delay: 0s; }
  .float-card.c2 { bottom: 12%; right: -8%; animation-delay: 1.4s; }
  .float-card.c3 { bottom: 38%; left: -12%; animation-delay: 2.6s; }

  @keyframes float { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }

  /* ============================================================
     FAIXA DE VALORES
  ============================================================ */
  .strip {
    background: var(--verde-escuro); color: var(--creme);
    padding: 26px 0; overflow: hidden;
  }
  .strip-track {
    display: flex; gap: 60px; align-items: center;
    animation: marquee 28s linear infinite; white-space: nowrap;
  }
  .strip-track span { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.15rem; opacity: .9; }
  .strip-track span::before { content: '✦'; color: var(--mostarda); margin-right: 16px; font-style: normal; }
  @keyframes marquee { from { transform: translateX(0);} to { transform: translateX(-50%);} }

  /* ============================================================
     SOBRE / HISTÓRIA
  ============================================================ */
  .about { padding: 110px 0; }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
  .about-visual { position: relative; }
  .about-visual .block-a {
    height: 380px; border-radius: var(--radius);
    background: linear-gradient(140deg, var(--verde-medio), var(--verde-escuro));
    display: grid; place-items: center; color: var(--mostarda);
    font-family: 'Fraunces', serif; font-size: 5rem; font-weight: 900;
    box-shadow: var(--sombra-lg);
  }
  .about-visual .block-b {
    position: absolute; bottom: -30px; right: -30px;
    width: 180px; height: 180px; border-radius: var(--radius);
    background: var(--mostarda); display: grid; place-items: center; text-align: center;
    padding: 20px; box-shadow: var(--sombra-md);
    font-family: 'Fraunces', serif; color: var(--carvao);
  }
  .about-visual .block-b strong { display: block; font-size: 2.4rem; line-height: 1; }
  .about-visual .block-b span { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }

  .about-text h2 { font-size: clamp(2rem, 3.6vw, 2.9rem); color: var(--verde-escuro); margin-bottom: 22px; }
  .about-text h2 em { color: var(--mostarda-esc); font-style: italic; font-weight: 600; }
  .about-text p { color: var(--cinza); margin-bottom: 18px; font-size: 1.02rem; }

  .about-stats { display: flex; gap: 40px; margin-top: 38px; flex-wrap: wrap; }
  .about-stats .stat strong { font-family: 'Fraunces', serif; font-size: 2rem; color: var(--verde-escuro); display: block; line-height: 1; }
  .about-stats .stat span { font-size: .82rem; color: var(--cinza); text-transform: uppercase; letter-spacing: .08em; }

  /* ============================================================
     SECÇÃO LOJA (oculta inicialmente)
  ============================================================ */
  .loja-section { display: none; padding: 60px 0 110px; }
  .loja-section.active { display: block; animation: fadeIn .5s ease; }
  .info-section.hidden { display: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(18px);} to { opacity: 1; transform: translateY(0);} }

  .loja-header { margin-bottom: 50px; }
  .loja-header .eyebrow { margin-bottom: 18px; }
  .loja-header h2 { font-size: clamp(2.2rem, 4.4vw, 3.4rem); color: var(--verde-escuro); margin-bottom: 16px; }
  .loja-header p { color: var(--cinza); max-width: 560px; font-size: 1.05rem; }

  .filtros { display: flex; gap: 12px; flex-wrap: wrap; margin: 34px 0 44px; }
  .filtro {
    padding: 10px 22px; border-radius: 100px; font-size: .88rem; font-weight: 600;
    background: var(--branco); color: var(--verde-escuro);
    border: 1.5px solid rgba(31,61,43,.14);
    transition: var(--trans);
  }
  .filtro:hover { border-color: var(--mostarda); color: var(--mostarda-esc); }
  .filtro.active { background: var(--verde-escuro); color: var(--creme); border-color: var(--verde-escuro); }

  /* Grelha de produtos */
  .produtos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 30px;
  }

  .produto {
    background: var(--branco); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--sombra-sm);
    transition: var(--trans); position: relative;
    display: flex; flex-direction: column;
    border: 1px solid rgba(31,61,43,.05);
  }
  .produto:hover { transform: translateY(-8px); box-shadow: var(--sombra-lg); }

  .produto .thumb {
    height: 250px; position: relative; overflow: hidden;
    display: grid; place-items: center;
    background: var(--creme-2);
  }
  .produto .thumb .frasco {
    width: 88px; height: 160px; border-radius: 22px 22px 18px 18px;
    position: relative; transition: transform var(--trans);
    box-shadow: inset -8px 0 18px rgba(0,0,0,.28), inset 8px 0 14px rgba(255,255,255,.08), 0 14px 28px rgba(0,0,0,.18);
  }
  .produto .thumb .frasco::before {
    content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 18px; border-radius: 6px 6px 3px 3px;
    background: linear-gradient(180deg, #d9b45a, #a8862f);
  }
  .produto .thumb .frasco::after {
    content: ''; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 48px; height: 2px; background: rgba(255,255,255,.5); box-shadow: 0 -10px 0 rgba(255,255,255,.35), 0 10px 0 rgba(255,255,255,.35);
  }
  .produto:hover .thumb .frasco { transform: scale(1.06) rotate(-2deg); }

  /* Cores por tipo de óleo */
  .f-oliva   { background: linear-gradient(160deg, #6b8f3a, #3f5a1f); }
  .f-coco    { background: linear-gradient(160deg, #f2ead6, #d8c9a3); }
  .f-amendoa { background: linear-gradient(160deg, #d9a05b, #a86b2a); }
  .f-girassol{ background: linear-gradient(160deg, #f5c542, #d49a0a); }
  .f-ricino  { background: linear-gradient(160deg, #cfd6c2, #9aa885); }
  .f-sesamo  { background: linear-gradient(160deg, #b98a4a, #7d5522); }

  .produto .badge {
    position: absolute; top: 16px; left: 16px;
    background: var(--verde-escuro); color: var(--creme);
    font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 12px; border-radius: 100px; z-index: 2;
  }
  .produto .badge.promo { background: var(--mostarda); color: var(--carvao); }

  .produto .fav {
    position: absolute; top: 14px; right: 14px;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.9); display: grid; place-items: center;
    color: var(--cinza); font-size: 1.05rem; z-index: 2;
    transition: var(--trans);
  }
  .produto .fav:hover, .produto .fav.on { color: #d64545; transform: scale(1.1); }

  .produto .info { padding: 22px 22px 24px; display: flex; flex-direction: column; flex: 1; }
  .produto .cat { font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--mostarda-esc); margin-bottom: 8px; }
  .produto h3 { font-size: 1.28rem; color: var(--verde-escuro); margin-bottom: 8px; }
  .produto .desc { font-size: .88rem; color: var(--cinza); margin-bottom: 18px; flex: 1; }

  .produto .rating { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--cinza); margin-bottom: 16px; }
  .produto .rating .stars { color: var(--mostarda); letter-spacing: 1px; }

  .produto .rodape { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .produto .preco { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: var(--verde-escuro); line-height: 1; }
  .produto .preco small { font-size: .78rem; color: var(--cinza); text-decoration: line-through; display: block; font-family: 'Inter', sans-serif; font-weight: 400; margin-top: 4px; }

  .add-cart {
    width: 46px; height: 46px; border-radius: 14px;
    background: var(--verde-escuro); color: var(--creme);
    display: grid; place-items: center; transition: var(--trans);
    flex-shrink: 0;
  }
  .add-cart:hover { background: var(--mostarda); color: var(--carvao); transform: rotate(-6deg) scale(1.08); }
  .add-cart svg { width: 20px; height: 20px; }

  /* ============================================================
     CART DRAWER
  ============================================================ */
  .cart-overlay {
    position: fixed; inset: 0; background: rgba(26,26,24,.5);
    opacity: 0; visibility: hidden; transition: var(--trans); z-index: 200;
    backdrop-filter: blur(3px);
  }
  .cart-overlay.open { opacity: 1; visibility: visible; }

  .cart-drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100%);
    background: var(--creme); z-index: 201;
    transform: translateX(100%); transition: transform .45s cubic-bezier(.22,.61,.36,1);
    display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.2);
  }
  .cart-drawer.open { transform: translateX(0); }

  .cart-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 28px; border-bottom: 1px solid rgba(31,61,43,.1);
  }
  .cart-head h3 { font-size: 1.4rem; color: var(--verde-escuro); }
  .cart-close { font-size: 1.6rem; color: var(--cinza); width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; transition: var(--trans); }
  .cart-close:hover { background: rgba(31,61,43,.08); color: var(--verde-escuro); }

  .cart-body { flex: 1; overflow-y: auto; padding: 20px 28px; }
  .cart-empty { text-align: center; color: var(--cinza); padding: 60px 20px; }
  .cart-empty .emoji { font-size: 3rem; margin-bottom: 14px; }

  .cart-item {
    display: flex; gap: 14px; padding: 16px 0;
    border-bottom: 1px solid rgba(31,61,43,.08);
    animation: fadeIn .3s ease;
  }
  .cart-item .mini {
    width: 56px; height: 72px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center; box-shadow: inset -5px 0 12px rgba(0,0,0,.25);
  }
  .cart-item .mini i { width: 20px; height: 40px; border-radius: 6px; background: rgba(255,255,255,.25); display: block; }
  .cart-item .dados { flex: 1; }
  .cart-item .dados h4 { font-family: 'Inter', sans-serif; font-size: .95rem; font-weight: 600; color: var(--verde-escuro); }
  .cart-item .dados .p { font-size: .85rem; color: var(--mostarda-esc); font-weight: 600; margin-top: 2px; }
  .cart-item .qtd { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .cart-item .qtd button {
    width: 26px; height: 26px; border-radius: 8px; b
